<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hotel Bill</title>
<style>
  :root{--bg:#f6f3ee;--card:#fff;--ink:#1f2a24;--muted:#6b756f;--green:#1f6b4f;--red:#b3392f;--line:#e4dfd6}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:230px}
  header{padding:18px 16px 10px;font-size:22px;font-weight:700}
  .add{display:flex;gap:8px;padding:0 16px 14px;flex-wrap:wrap;align-items:center}
  .add input[type=text],.add input[type=number]{flex:1 1 120px;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:var(--card)}
  .add input.p{flex:0 0 90px}
  .add button,.cam{padding:12px 16px;border:0;border-radius:10px;background:var(--green);color:#fff;font-size:16px;font-weight:600}
  .cam{background:#fff;color:var(--ink);border:1px solid var(--line);display:flex;align-items:center;gap:6px;cursor:pointer}
  #preview{width:48px;height:48px;border-radius:10px;object-fit:cover;display:none;border:1px solid var(--line)}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 16px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;font-size:16px;position:relative;cursor:pointer}
  .item:active{transform:scale(.97)}
  .item img,.item .ph{width:100%;height:100px;object-fit:cover;display:block;background:#efeae0}
  .item .ph{display:flex;align-items:center;justify-content:center;font-size:34px}
  .item .info{padding:10px 12px}
  .item b{display:block;margin-bottom:2px}
  .item span{color:var(--muted)}
  .item .del{position:absolute;top:6px;right:6px;color:#fff;background:rgba(179,57,47,.9);border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:16px}
  .item .badge{position:absolute;top:6px;left:6px;background:var(--green);color:#fff;border-radius:20px;min-width:26px;height:26px;display:none;align-items:center;justify-content:center;font-size:14px;padding:0 6px}
  .bill{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--green);padding:12px 16px;max-height:55vh;overflow:auto;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
  .row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:15px;gap:8px}
  .row .q button{width:28px;height:28px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:16px}
  .row .q{display:flex;align-items:center;gap:6px}
  .total{display:flex;justify-content:space-between;font-size:20px;font-weight:700;padding-top:8px;border-top:1px dashed var(--line);margin-top:6px}
  .actions{display:flex;gap:8px;margin-top:10px}
  .actions button{flex:1;padding:12px;border:0;border-radius:10px;font-size:16px;font-weight:600}
  .clear{background:#eee;color:var(--ink)} .print{background:var(--green);color:#fff}
  .empty{color:var(--muted);font-size:14px;padding:4px 0}
  @media print{.add,.grid,.actions{display:none}.bill{position:static;box-shadow:none}}
</style>
</head>
<body>
<header>🍽️ Hotel Bill</header>

<div class="add">
  <label class="cam">📷 Photo
    <input id="photo" type="file" accept="image/*" capture="environment" hidden>
  </label>
  <img id="preview" alt="">
  <input id="name" type="text" placeholder="Item name (Dosa)">
  <input id="price" class="p" type="number" inputmode="numeric" placeholder="₹ Price">
  <button onclick="addItem()">+ Add Item</button>
</div>

<div class="grid" id="grid"></div>

<div class="bill">
  <div id="lines"></div>
  <div class="total"><span>Total</span><span id="total">₹0</span></div>
  <div class="actions">
    <button class="clear" onclick="clearBill()">Clear</button>
    <button class="print" onclick="window.print()">Print</button>
  </div>
</div>

<script>
  let items = [
    {name:"Idli",price:30},{name:"Dosa",price:50},{name:"Poori",price:50},
    {name:"Pongal",price:45},{name:"Parotta",price:20},{name:"Biryani",price:150},
    {name:"Chicken Fry",price:120},{name:"Tea",price:12},{name:"Coffee",price:15}
  ];
  let cart = {};
  let newPhoto = "";
  try{
    const s = localStorage.getItem("hotelItems");
    if(s) items = JSON.parse(s);
  }catch(e){}

  function save(){
    try{localStorage.setItem("hotelItems",JSON.stringify(items));}
    catch(e){alert("Storage full - konjam items/photos delete pannunga");}
  }

  // Photo eduthathum chinnathaa resize panni vachukum (storage save aaga)
  document.getElementById("photo").addEventListener("change",e=>{
    const f = e.target.files[0];
    if(!f) return;
    const img = new Image();
    const url = URL.createObjectURL(f);
    img.onload = ()=>{
      const max = 300, r = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement("canvas");
      c.width = img.width*r; c.height = img.height*r;
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      newPhoto = c.toDataURL("image/jpeg",0.7);
      const p = document.getElementById("preview");
      p.src = newPhoto; p.style.display = "block";
      URL.revokeObjectURL(url);
    };
    img.src = url;
  });

  function renderItems(){
    const g = document.getElementById("grid");
    g.innerHTML = "";
    items.forEach((it,i)=>{
      const d = document.createElement("div");
      d.className = "item";
      d.onclick = ()=>{cart[i]=(cart[i]||0)+1;render();};
      const pic = it.photo ? `<img src="${it.photo}" alt="">` : `<div class="ph">🍽️</div>`;
      d.innerHTML = `${pic}<div class="info"><b>${esc(it.name)}</b><span>₹${it.price}</span></div>
        <div class="del" onclick="event.stopPropagation();delItem(${i})">×</div>
        <div class="badge" style="display:${cart[i]?'flex':'none'}">${cart[i]||''}</div>`;
      g.appendChild(d);
    });
  }

  function renderBill(){
    const l = document.getElementById("lines");
    let total = 0, html = "";
    Object.keys(cart).forEach(i=>{
      const it = items[i], q = cart[i];
      if(!it||!q) return;
      total += it.price*q;
      html += `<div class="row"><span>${esc(it.name)} ₹${it.price}</span>
        <span class="q"><button onclick="chg(${i},-1)">−</button>${q}<button onclick="chg(${i},1)">+</button></span>
        <span>₹${it.price*q}</span></div>`;
    });
    l.innerHTML = html || '<div class="empty">Item click pannunga — bill inga varum</div>';
    document.getElementById("total").textContent = "₹"+total;
  }

  function render(){renderItems();renderBill();}

  function chg(i,n){
    cart[i]=(cart[i]||0)+n;
    if(cart[i]<=0) delete cart[i];
    render();
  }

  function addItem(){
    const n = document.getElementById("name").value.trim();
    const p = parseFloat(document.getElementById("price").value);
    if(!n || isNaN(p) || p<0){alert("Item name and price rendum podunga");return;}
    items.push({name:n,price:p,photo:newPhoto});
    save();
    newPhoto = "";
    document.getElementById("name").value="";
    document.getElementById("price").value="";
    document.getElementById("photo").value="";
    const pv = document.getElementById("preview");
    pv.style.display="none"; pv.src="";
    render();
  }

  function delItem(i){
    if(!confirm(items[i].name+" delete pannanuma?")) return;
    items.splice(i,1);
    cart = {};
    save();
    render();
  }

  function clearBill(){cart={};render();}

  function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

  render();
</script>
</body>
</html>
